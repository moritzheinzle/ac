{{ define "main" }}
<div class="container">
  <div style="margin-bottom: 0.75rem;">
    <a href="{{ "" | relURL }}">[← Parent Directory]</a>
  </div>

  <h1 class="course-title">{{ .Title }}</h1>
  {{ if .Description }}
  <div class="course-meta">{{ .Description }}</div>
  {{ end }}

  <hr>

  <article class="page-content" style="max-width: 750px; line-height: 1.6; margin-top: 1rem;">
    {{ .Content }}
  </article>
</div>
{{ end }}
