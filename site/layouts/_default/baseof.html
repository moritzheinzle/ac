<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}Index of /notes • {{ .Site.Title }}{{ else }}{{ .Title }} • {{ .Site.Title }}{{ end }}</title>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme-mode');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <link rel="stylesheet" href="{{ "css/portal.css" | relURL }}?v=classic">
</head>
<body>

  <header class="site-header">
    <div class="container top-bar">
      <div>
        <h1 class="header-title">
          <a href="{{ "" | relURL }}" style="text-decoration: none; color: inherit;">Index of /notes</a>
        </h1>
        <div style="font-size: 0.9rem; color: var(--text-muted);">
          {{ .Site.Params.subtitle | default "Academic Course Notes & Master Scripts" }}
        </div>
      </div>

      <nav class="header-nav">
        <a href="{{ "" | relURL }}">[Overview]</a>
        {{ if .Site.Params.githubRepo }}
        <a href="{{ .Site.Params.githubRepo }}" target="_blank" rel="noopener">[GitHub]</a>
        {{ end }}
        <button id="theme-toggle" class="theme-toggle-btn" type="button">Theme</button>
      </nav>
    </div>
  </header>

  <hr>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <hr>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div><strong>{{ .Site.Params.author | default "Moritz Heinzle" }}</strong></div>
      <div>{{ .Site.Title }}</div>
    </div>
  </footer>

  <script src="{{ "js/portal.js" | relURL }}"></script>
</body>
</html>
